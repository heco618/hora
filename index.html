.result-heading #resultTitle{min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
.result-export{flex:0 0 auto;white-space:nowrap;padding:9px 11px;font-size:12px;min-height:38px}

/* Preserve the existing toolbar height, image area and column arrangement. */
.topstats .metric{font-size:clamp(12px,3.55vw,16px);font-weight:700;gap:3px}
.topstats svg{width:clamp(16px,4.4vw,20px);height:clamp(16px,4.4vw,20px);flex-shrink:0}
@media(max-width:365px){.topstats .metric{font-size:12px}.topstats svg{width:16px;height:16px}.topstats .metrics-row{gap:1px}}

/* v2.4.7: Larger add-photo icon; photo frame extends left while plus remains separate.
   Native 24px line icon, same stroke as home and settings.
   The photo outline is an OPEN path around the plus: no masking or color-dependent knockout. */
#addBtn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;overflow:visible}

/* v2.5.0: immediate handle dragging */
.project{position:relative;transition:background .12s ease}
.project-handle{flex:0 0 32px;align-self:stretch;min-height:50px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:#aeb2bc;padding:0;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.project-handle svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.project-handle:active{color:#fff}
.project-drag-placeholder{border:1px dashed #a9caff;background:#202a3a;visibility:visible!important}
.project-drag-placeholder>*{visibility:hidden}
.project-drag-ghost{position:fixed;z-index:9999;pointer-events:none;margin:0!important;box-shadow:0 14px 35px #0009;border-color:#a9caff;opacity:.97;transform:scale(1.015);transform-origin:center}
@media(max-width:390px){.project{gap:7px;padding:12px 9px}.project-handle{flex-basis:27px}.project .row{gap:5px}.project .row button{padding:9px 10px}}

/* v2.5.0 light appearance: no duplicate screens or icon assets. */
.appearance-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.appearance-choice{min-height:44px;border-radius:10px;padding:8px 3px;font-size:clamp(11px,3vw,14px);border:1px solid #505665;background:#303139;color:#fff}
.appearance-choice.chosen{border:2px solid #9bbdff;background:#303b50;font-weight:700}

html[data-theme="light"] header{background:#e9ebf0;color:#1a202c}

html[data-theme="light"] .stat{background:#e6e8ee;color:#182130}

html[data-theme="light"] .appearance-choice{background:#fff;color:#202733;border-color:#cbd2de}

html[data-theme="light"] .selection-toolbar{background:#e8ecf3;border-color:#c5cedb}
html[data-theme="light"] .selection-statusbar{background:#e8ecf3;border-color:#c5cedb}
html[data-theme="light"] .selection-status-label{color:#536278}

html[data-theme="light"] .current-status.status-good{background:#d6f3e1;color:#126139}
html[data-theme="light"] .current-status.status-bad{background:#fce0e3;color:#9d2937}

/* Original-image preview intentionally remains dark for image contrast. */
html[data-theme="light"] .preview-overlay{background:rgba(5,7,12,.96);color:#fff}
html[data-theme="light"] .preview-name{color:#e8ebf2}
html[data-theme="light"] .preview-overlay .secondary{background:#303139;color:#fff}
html[data-theme="light"] .preview-counter{color:#bdc5d2}

html[data-theme="light"] .preview-classify button[data-preview-status="bad"].selected{background:#58282a;border-color:#ef777a;color:#ffbfc0}
html[data-theme="light"] .preview-classify button[data-preview-status="fix"].selected{background:#59451c;border-color:#e1b24e;color:#ffe7a6}
html[data-theme="light"] .preview-classify button[data-preview-status=""].selected{background:#3b4555;border-color:#acb9cf;color:#fff}

/* v2.5.1: settings grouped by purpose */
.settings-group{margin:18px 0 22px;padding:0;border:1px solid #3b3e47;border-radius:12px;overflow:hidden;background:#1d1f25}
.settings-group>h3{margin:0;padding:13px 15px;background:#292c34;font-size:15px;border-bottom:1px solid #3b3e47}
.settings-group-body{padding:12px 14px 15px}
.settings-group-body h4{font-size:13px;margin:7px 0 10px;font-weight:700;color:#e7e9f0}
.settings-group-body h4:not(:first-child){margin-top:20px;padding-top:16px;border-top:1px solid #3b3e47}
.settings-group-body .muted{margin:9px 0 0}
html[data-theme="light"] .settings-group{background:#fff;border-color:#d6dce6}
html[data-theme="light"] .settings-group>h3{background:#eef1f6;border-color:#d6dce6}
html[data-theme="light"] .settings-group-body h4{color:#222b3b}
html[data-theme="light"] .settings-group-body h4:not(:first-child){border-color:#d6dce6}
/* Centered empty-project action; navigation buttons remain in their existing slots */
.empty-add{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 26px;min-width:155px;min-height:145px;background:#24262c;border:1px solid #444a55;border-radius:14px;color:#f3f5f9;font-size:16px;font-weight:700;cursor:pointer}
.empty-add svg{width:48px;height:48px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.empty-add:active{background:#363b47}
html[data-theme="light"] .empty-add{background:#f0f3f8;border-color:#ccd3df;color:#1e2734}
html[data-theme="light"] .empty-add:active{background:#e3e8f2}
/* 12 equal sections over the ENTIRE gauge, regardless of fill width */
.progress-track.style-energy .progress-fill{background:linear-gradient(90deg,var(--g1),var(--g2))!important}
.progress-track.style-energy::after{content:"";position:absolute;z-index:2;inset:0;pointer-events:none;background-image:linear-gradient(to right,transparent calc(100% - 2px),#101924 calc(100% - 2px));background-size:8.333333333% 100%;background-repeat:repeat-x}
.style-choice[data-style="energy"] .mini-fill{background:linear-gradient(90deg,var(--g1),var(--g2))!important}
.style-choice[data-style="energy"] .mini-bar{position:relative;overflow:hidden}
.style-choice[data-style="energy"] .mini-bar::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,transparent calc(100% - 2px),#111924 calc(100% - 2px));background-size:8.333333333% 100%;background-repeat:repeat-x}
/* v2.5.4: Reserve a separate bottom strip for image navigation.
   Portrait and landscape images both remain fully visible (object-fit:contain).
   Only the image's available display area changes; swipe and button hit areas stay put. */
#viewer .photo{top:0;bottom:auto;height:calc(100% - 88px - env(safe-area-inset-bottom));object-fit:contain}

/* v2.5.5: compact two-level progress meter and per-project section pins. */
.selection-toolbar{height:59px;padding:4px 10px}
.topstats{gap:7px!important}
.progress-stack{flex:0 0 clamp(112px,35vw,175px);width:clamp(112px,35vw,175px);min-width:0;display:flex;flex-direction:column;gap:3px}
.section-track{display:flex;align-items:stretch;height:24px;width:100%;background:#303642;overflow:hidden;position:relative;border:1px solid #4a5a70}
.section-segment{min-width:17px;flex-basis:0;display:flex;align-items:center;justify-content:center;background:#334d68;color:#fff;font-size:12px;font-weight:750;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.section-segment.section-current{background:#29323f}
.section-segment.section-zero{background:#303642}
.section-marker{position:relative;flex:0 0 2px;background:#b8caff;padding:0;border:0;border-radius:0;cursor:pointer;z-index:2;touch-action:manipulation}
.section-marker::after{content:'';position:absolute;top:0;bottom:0;left:-7px;right:-7px}
.section-marker:focus-visible{outline:2px solid #fff;outline-offset:2px}
.progress-stack .progress-track{flex:0 0 auto!important;width:100%;height:16px!important;min-height:16px}
.progress-stack .progress-label{font-size:10px!important;letter-spacing:0}
.section-pin-button{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:25px;display:flex;align-items:center;justify-content:center;border:1px solid #59677b;border-radius:5px;background:#29323d;color:#aebbd0;padding:3px;touch-action:manipulation}
.section-pin-button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.section-pin-button.is-pinned{color:#b9d3ff;background:#273d60;border-color:#91b8ff}
.selection-statusbar{position:relative;padding-right:39px}
html[data-theme="light"] .section-track{background:#dbe2eb;border-color:#9cabc0}
html[data-theme="light"] .section-segment{background:#d0e0f5;color:#263b5c}
html[data-theme="light"] .section-segment.section-current,html[data-theme="light"] .section-segment.section-zero{background:#e3e8f0;color:#263b5c}
html[data-theme="light"] .section-marker{background:#4d78b5}
html[data-theme="light"] .section-pin-button{background:#e3e8f0;color:#465773;border-color:#9cabc0}
html[data-theme="light"] .section-pin-button.is-pinned{background:#d5e5ff;color:#2457a2;border-color:#5087cf}
/* Maintain the reserved lower navigation strip from v2.5.4. */
.viewer{height:calc(100dvh - 54px - 59px - 27px)!important}
@media(max-width:365px){.progress-stack{flex-basis:104px;width:104px}.section-segment{font-size:11px;min-width:12px}.section-track{height:22px}}

/* v2.5.6: section boundaries share the selected gauge color; quiet compact display. */
.section-track{--section-accent:#3c97ff;--section-soft:#133f87;--section-bright:#b9f4ff;border-color:var(--section-soft);background:var(--section-bg,#303642);height:22px}
.section-segment{min-width:0;background:color-mix(in srgb,var(--section-soft) 48%,#303642);font-size:11px;color:#fff;flex-shrink:1}
.section-segment.section-current{background:color-mix(in srgb,var(--section-soft) 60%,#303642)}
.section-segment.section-zero{background:color-mix(in srgb,var(--section-soft) 28%,#303642)}
.section-marker{background:var(--section-accent);flex-basis:2px;min-width:2px}
.section-track::before,.section-track::after{content:'';position:absolute;top:0;bottom:0;width:2px;background:var(--section-accent);z-index:1;pointer-events:none}
.section-track::before{left:0}.section-track::after{right:0}
.section-pin-button.is-pinned{color:var(--section-bright,#b9d3ff);border-color:var(--section-accent,#91b8ff);background:color-mix(in srgb,var(--section-soft,#273d60) 60%,#29323d)}
.section-pin-button.is-fixed{opacity:.75;cursor:default}
html[data-theme="light"] .section-segment{color:#1c2b3c;background:color-mix(in srgb,var(--section-accent) 15%,#e3e8f0)}
html[data-theme="light"] .section-segment.section-current{background:color-mix(in srgb,var(--section-accent) 24%,#e3e8f0)}
html[data-theme="light"] .section-segment.section-zero{background:color-mix(in srgb,var(--section-accent) 9%,#e3e8f0)}
html[data-theme="light"] .section-marker{background:var(--section-accent)}
.section-setup-overlay{position:fixed;inset:0;z-index:150;background:rgba(5,8,14,.85);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.section-setup-overlay.hidden{display:none!important}
.section-setup-dialog{width:min(100%,520px);max-height:min(86dvh,850px);display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:14px;background:var(--card,#22242a);color:var(--text,#fff);border:1px solid var(--line,#40434b);box-shadow:0 12px 42px #0006}
.section-setup-head{padding:16px;display:flex;flex-direction:column;gap:9px}
.section-setup-head h3{margin:0;font-size:18px}
.section-setup-head p{margin:0;font-size:13px;line-height:1.6;opacity:.75}
.section-setup-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.section-setup-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:8px 12px 18px;overflow-y:auto;overscroll-behavior:contain;min-height:0}
.section-setup-cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;background:var(--input,#343740);color:var(--text,#fff);touch-action:manipulation}
.section-setup-cell img{width:100%;height:100%;object-fit:cover;display:block}
.section-setup-cell .section-num{position:absolute;left:3px;bottom:3px;background:#000b;color:#fff;font-size:10px;border-radius:3px;padding:1px 3px}
.section-setup-cell .section-pin-tag{position:absolute;right:2px;top:2px;background:var(--section-accent,#3c97ff);color:#10141d;font-size:10px;font-weight:750;padding:2px 4px;border-radius:3px}
.section-setup-cell.is-marked{border-color:var(--section-accent,#3c97ff)}
.section-setup-cell.is-fixed{border-color:var(--section-accent,#3c97ff);opacity:.85}

/* v2.5.7: square, scrollable four-column setup thumbnails; quieter section summary. */
.section-setup-dialog{height:min(86dvh,850px);max-height:86dvh}
.section-setup-head{flex:0 0 auto}
.section-setup-grid{flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;align-content:start;align-items:start;grid-auto-rows:max-content;-webkit-overflow-scrolling:touch;contain:layout}
.section-setup-cell{display:block;position:relative;width:100%;height:auto;aspect-ratio:1 / 1;min-width:0;min-height:0;max-height:none;flex:none;align-self:start;box-sizing:border-box;overflow:hidden}
.section-setup-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.section-setup-cell .section-num,.section-setup-cell .section-pin-tag{z-index:2}
/* v2.5.8: section is a subdued, slim counter; main progress remains dominant. */
.section-track{height:10px;min-height:10px;border-color:var(--line,#45576e);background:var(--section-bg,#101924);overflow:visible}
.section-segment,.section-segment.section-current,.section-segment.section-zero{background:#101924!important;color:#dce3ee!important;font-size:8px;font-weight:650;line-height:8px}
.section-marker{background:var(--section-accent);min-width:2px;flex-basis:2px}
.section-track::before,.section-track::after{display:none!important}
.section-edge{position:absolute;top:0;bottom:0;width:2px;z-index:4;border:0;border-radius:0;background:var(--section-accent);padding:0;cursor:pointer;touch-action:manipulation}
.section-edge.start{left:0}.section-edge.end{right:0}
.section-edge::after{content:'';position:absolute;inset:-5px -7px}
.progress-stack{gap:3px}
.progress-stack .progress-track{height:22px!important;min-height:22px;flex-basis:22px!important}
.progress-stack .progress-label{font-size:11px!important}
html[data-theme="light"] .section-track{background:#e3e8f0;border-color:#9cabc0}
html[data-theme="light"] .section-segment,html[data-theme="light"] .section-segment.section-current,html[data-theme="light"] .section-segment.section-zero{background:#e3e8f0!important;color:#334155!important}
.section-setup-cell .section-pin-tag{display:flex;align-items:center;justify-content:center;width:19px;height:19px;padding:2px;border-radius:4px}
.section-setup-cell .section-pin-tag[hidden]{display:none}
.section-pin-tag svg{display:block;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:365px){.section-track{height:10px;min-height:10px}.section-segment{font-size:8px}}

/* v2.5.9: final image classification opens a self-contained completion screen. */
.finish-screen{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3.2dvh,30px);padding:20px 20px calc(env(safe-area-inset-bottom) + 84px);background:#08090b;overflow:hidden}
.finish-art{display:block;max-width:min(100%,480px);max-height:min(65dvh,calc(100% - 78px));width:auto;height:auto;object-fit:contain;border-radius:8px}
.finish-results{flex:none;min-width:min(260px,82%);font-size:17px;min-height:52px;display:flex;align-items:center;justify-content:center;gap:14px;touch-action:manipulation}
.finish-results span{font-size:25px;line-height:1}
html[data-theme="light"] .finish-screen{background:#f4f6f9}
@media(max-height:600px){.finish-screen{padding-bottom:70px;gap:10px}.finish-art{max-height:calc(100% - 66px)}}

/* v2.6.0: completion is a full-screen panel, independent of the photo viewer stacking order. */
#finishScreen{position:fixed!important;inset:0!important;z-index:9999!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 28px);background:#08090b;overflow:auto;touch-action:auto}
#finishScreen.hidden{display:none!important}
#finishScreen .finish-art{display:block;width:min(100%,440px);height:auto;max-height:min(67dvh,580px);object-fit:contain;flex-shrink:1;min-height:0}
#finishScreen .finish-results{display:flex;flex-shrink:0;align-items:center;justify-content:center;min-height:54px;min-width:min(280px,88%);font-size:18px}
html[data-theme="light"] #finishScreen{background:#f4f6f9}

/* v2.6.1: completion content occupies only the image viewer; normal selection controls remain visible. */
#finishScreen{position:absolute!important;inset:0!important;z-index:3!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:clamp(12px,2.2dvh,22px)!important;padding:12px 16px calc(env(safe-area-inset-bottom) + 86px)!important;background:#08090b!important;overflow:hidden!important;touch-action:auto!important;box-sizing:border-box!important}

<section id="results" class="panel hidden"><div class="row between result-heading"><h2 id="resultTitle">選定結果</h2><button id="exportZip" class="primary result-export" type="button" aria-label="分類別にまとめてZIP保存" title="分類別にまとめてZIP保存">ZIP保存</button></div><div class="stats" id="stats"></div><div class="displaybar"><label for="gridCols">表示</label><select id="gridCols" aria-label="画像の表示列数"><option value="1">1列</option><option value="2">2列</option><option value="3">3列</option><option value="4">4列</option><option value="5">5列</option></select><label for="gridSort">並び順</label><select id="gridSort"><option value="original">読み込み順</option><option value="nameAsc">名前順 A→Z</option><option value="nameDesc">名前順 Z→A</option><option value="judged">判定した順</option></select><label class="name-toggle"><input type="checkbox" id="showNames">名前表示</label></div><div class="row" style="margin-bottom:8px"><button id="bulkToggle" class="secondary">まとめて選択</button><button id="sectionViewToggle" class="secondary" type="button" aria-pressed="false">セクションごとに表示</button><span id="bulkStatus" class="bulkcount"></span></div><div id="bulkBar" class="bulkbar hidden"><button id="rangeSelect" class="secondary">範囲選択</button><button id="selectAll" class="secondary">表示中をすべて選択</button><button id="clearSelected" class="secondary">選択解除</button><button class="secondary" data-bulk="good">GOODへ</button><button class="secondary" data-bulk="bad">BADへ</button><button class="secondary" data-bulk="fix">要修正へ</button><button class="secondary" data-bulk="">未選定へ</button></div><div id="rangeHint" class="rangehint hidden"></div><p class="small">画像をタップ・長押しすると元画像をプレビューできます。ZIPには元画像が分類別フォルダに入ります。書き出してもアプリ内の画像は削除されません。大量の画像はZIP作成に時間がかかる場合があります。</p><div id="tiles" class="list"></div></section><section id="settings" class="panel hidden"><div class="row between"><h2>設定</h2><button id="settingsBack" class="secondary">戻る</button></div><section class="settings-group" aria-labelledby="appearanceGroupTitle"><h3 id="appearanceGroupTitle">画面表示</h3><div class="settings-group-body"><h4>画面テーマ</h4><div class="appearance-options" id="appearanceOptions" role="group" aria-label="画面テーマ"></div><p class="muted">ダーク・ライト・端末の設定から選べます。</p></div></section><section class="settings-group" aria-labelledby="gaugeGroupTitle"><h3 id="gaugeGroupTitle">進捗ゲージ</h3><div class="settings-group-body"><h4>ゲージスタイル</h4><div id="styleOptions" class="style-options"></div><h4>ゲージカラー</h4><div id="colorOptions" class="color-options"></div></div></section><section class="settings-group" aria-labelledby="appGroupTitle"><h3 id="appGroupTitle">アプリの操作</h3><div class="settings-group-body"><button id="reloadApp" class="secondary" type="button">アプリを再読み込み</button><p class="muted">保存済みの画像や判定結果は削除されません。</p></div></section><p class="muted">各設定は自動保存されます。</p></section></div><div id="previewOverlay" class="preview-overlay hidden" role="dialog" aria-modal="true" aria-label="元画像プレビュー"><div class="preview-top"><span class="preview-name" id="previewName"></span><button class="secondary" id="previewClose" aria-label="プレビューを閉じる">閉じる ×</button></div><div class="preview-image-wrap"><img class="preview-image" id="previewImage" alt="元画像"></div><div class="preview-nav" aria-label="プレビューのページ移動"><button class="secondary" id="previewPrev" type="button" aria-label="前の画像">‹ 前へ</button><span id="previewCounter" class="preview-counter"></span><button class="secondary" id="previewNext" type="button" aria-label="次の画像">次へ ›</button></div><div class="preview-classify" role="group" aria-label="画像の分類を変更"><button type="button" data-preview-status="good">GOOD</button><button type="button" data-preview-status="bad">BAD</button><button type="button" data-preview-status="fix">要修正</button><button type="button" data-preview-status="">未選定</button></div><div class="preview-actions"><button class="secondary" id="previewSave">元画像を保存</button></div></div><div id="sectionSetup" class="section-setup-overlay hidden" role="dialog" aria-modal="true" aria-label="セクション設定"><div class="section-setup-dialog"><div class="section-setup-head"><h3 id="sectionSetupTitle">セクションごとに区切りますか？</h3><p id="sectionSetupHelp">選定前に画像の区切り位置を設定できます。</p><div class="section-setup-actions"><button id="sectionSetupNo" class="secondary" type="button">いいえ</button><button id="sectionSetupYes" class="primary" type="button">はい</button><button id="sectionSetupCancel" class="secondary hidden" type="button">キャンセル</button><button id="sectionSetupDone" class="primary hidden" type="button">選定を開始</button></div></div><div id="sectionSetupGrid" class="section-setup-grid hidden"></div></div></div><div id="notice"></div><input id="picker" class="file" type="file" accept="image/*" multiple>
<script>
const $=id=>document.getElementById(id);let sectionView=false;let db,projects=[],current=null,images=[],index=0,history=[],urls=new Map(),thumbUrls=new Map(),thumbObserver=null,photoRetry=0,photoLoadToken=0,tab='good',bulkMode=false,selectedIds=new Set(),rangeMode=false,rangeStart=null,visibleIds=[],gridCols=3,gridSort='original',showNames=false,dragSelection=null,scale=1,dx=0,dy=0,gesture=null,animating=false,frame=0;const enc=new TextEncoder();
// Appearance is independent of the progress gauge's color setting.
const APPEARANCE_KEY='image-sorter-appearance-v1';
const appearanceMedia=window.matchMedia('(prefers-color-scheme: dark)');
let appearance='dark';
try{const saved=localStorage.getItem(APPEARANCE_KEY);if(['dark','light','system'].includes(saved))appearance=saved}catch{}
function applyAppearance(){
  const resolved=appearance==='system'?(appearanceMedia.matches?'dark':'light'):appearance;
  document.documentElement.dataset.theme=resolved;
  document.documentElement.style.colorScheme=resolved;
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=resolved==='light'?'#f4f5f8':'#101114';
}
function setAppearance(value){
  if(!['dark','light','system'].includes(value))return;
  appearance=value;
  try{localStorage.setItem(APPEARANCE_KEY,value)}catch{}
  applyAppearance();renderAppearanceOptions();
}
function renderAppearanceOptions(){
  const root=$('appearanceOptions');if(!root)return;
  root.replaceChildren();
  for(const [value,label] of [['dark','ダーク'],['light','ライト'],['system','端末に合わせる']]){
    const btn=document.createElement('button');btn.type='button';btn.className='appearance-choice'+(appearance===value?' chosen':'');
    btn.textContent=label;btn.setAttribute('aria-pressed',String(appearance===value));
    btn.onclick=()=>setAppearance(value);root.append(btn);
  }
}
applyAppearance();
if(appearanceMedia.addEventListener)appearanceMedia.addEventListener('change',()=>{if(appearance==='system')applyAppearance()});
else if(appearanceMedia.addListener)appearanceMedia.addListener(()=>{if(appearance==='system')applyAppearance()});
const DISPLAY_KEY='image-sorter-display-v1';
try{const saved=JSON.parse(localStorage.getItem(DISPLAY_KEY)||'{}');if([1,2,3,4,5].includes(Number(saved.cols)))gridCols=Number(saved.cols);if(['original','nameAsc','nameDesc','judged'].includes(saved.sort))gridSort=saved.sort;showNames=!!saved.names}catch{}
function saveDisplay(){try{localStorage.setItem(DISPLAY_KEY,JSON.stringify({cols:gridCols,sort:gridSort,names:showNames}))}catch{}}
function naturalName(a,b){return a.name.localeCompare(b.name,'ja',{numeric:true,sensitivity:'base'})||(a.order??0)-(b.order??0)}
function visibleImages(){const arr=images.filter(x=>(x.status||'pending')===tab);if(gridSort==='nameAsc')arr.sort(naturalName);else if(gridSort==='nameDesc')arr.sort((a,b)=>-naturalName(a,b));else if(gridSort==='judged')arr.sort((a,b)=>(a.judgedAt??a.order)-(b.judgedAt??b.order)||a.order-b.order);return arr}
function updateSelectedUI(){
  $('bulkStatus').textContent=bulkMode?`${selectedIds.size}枚選択中`:'';
  for(const tile of $('tiles').children){const yes=selectedIds.has(tile.dataset.imageId);tile.classList.toggle('selected',yes);const mark=tile.querySelector('.pickmark');if(mark)mark.textContent=yes?'✓':''}
}
function chooseRange(a,b,base){const lo=Math.min(a,b),hi=Math.max(a,b);selectedIds=new Set(base);for(let i=lo;i<=hi;i++)selectedIds.add(visibleIds[i]);updateSelectedUI()}
function resetRange(){rangeMode=false;rangeStart=null;$('rangeSelect').classList.remove('active');$('rangeSelect').textContent='範囲選択';$('rangeHint').classList.add('hidden')}
function rangeTap(id){const at=visibleIds.indexOf(id);if(at<0)return;
 if(rangeStart===null){rangeStart=at;$('rangeHint').textContent=`開始位置を指定しました（${at+1}枚目）。終点の画像をタップしてください。`}
 else{chooseRange(rangeStart,at,selectedIds);resetRange()}
}
function setRangeHint(){if(!rangeMode)return;$('rangeHint').classList.remove('hidden');$('rangeHint').textContent='最初の画像をタップして、次に最後の画像をタップしてください。'}
let dragScrollFrame=0,dragClientX=0,dragClientY=0;
function stopDragScroll(){if(dragScrollFrame)cancelAnimationFrame(dragScrollFrame);dragScrollFrame=0}
function dragTargetAt(x,y){const el=document.elementFromPoint(x,y)?.closest('.tile');if(!el||!$('tiles').contains(el))return -1;return visibleIds.indexOf(el.dataset.imageId)}
function dragMove(x,y){if(!dragSelection)return;dragClientX=x;dragClientY=y;const idx=dragTargetAt(x,y);if(idx>=0&&idx!==dragSelection.last){dragSelection.last=idx;chooseRange(dragSelection.start,idx,dragSelection.base)}}
function dragAutoScroll(){if(!dragSelection)return;const edge=65,top=65,bottom=innerHeight-65;let amount=0;if(dragClientY<top)amount=-Math.min(17,(top-dragClientY)/3);else if(dragClientY>bottom)amount=Math.min(17,(dragClientY-bottom)/3);if(amount){window.scrollBy(0,amount);dragMove(dragClientX,dragClientY)}dragScrollFrame=requestAnimationFrame(dragAutoScroll)}

function toast(t){$('notice').textContent=t;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2400)}
function request(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
const SESSION_KEY='image-sorter-last-location-v1';
function readSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}}
function saveSession(view){try{localStorage.setItem(SESSION_KEY,JSON.stringify({projectId:current?.id||null,view:view||($('results').classList.contains('hidden')?($('select').classList.contains('hidden')?'home':'select'):'results'),index,tab}))}catch(e){console.warn('画面位置を保存できません',e)}}
async function init(){db=await new Promise((ok,no)=>{let r=indexedDB.open('image-sorter-v1',2);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});if(!d.objectStoreNames.contains('images')){let store=d.createObjectStore('images',{keyPath:'id'});store.createIndex('project','project')}if(!d.objectStoreNames.contains('thumbs'))d.createObjectStore('thumbs',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});const saved=readSession();if(saved?.projectId){const project=await get('projects',saved.projectId);if(project){await openProject(saved.projectId,saved);return}}await home()}
async function all(store){return request(db.transaction(store).objectStore(store).getAll())}async function put(store,item){return request(db.transaction(store,'readwrite').objectStore(store).put(item))}
async function del(store,key){return request(db.transaction(store,'readwrite').objectStore(store).delete(key))}
async function get(store,key){return request(db.transaction(store).objectStore(store).get(key))}
// Preserve newest-first order until the user explicitly drags a project.
// After a drag, persist an explicit numeric rank in the existing projects store.
function projectSort(a,b){
  const ar=Number.isFinite(a.sortOrder)?a.sortOrder:null;
  const br=Number.isFinite(b.sortOrder)?b.sortOrder:null;
  if(ar!==null&&br!==null)return ar-br;
  if(ar!==null)return -1;
  if(br!==null)return 1;
  return (b.created||0)-(a.created||0);
}
let projectDrag=null;
function endProjectDrag(commit){
  const d=projectDrag;if(!d)return;
  window.removeEventListener('pointermove',projectPointerMove);
  window.removeEventListener('pointerup',projectPointerUp);

    tile.addEventListener('touchmove',()=>{clearTimeout(holdTimer);holdTimer=null},{passive:true});
    tile.addEventListener('touchend',()=>{clearTimeout(holdTimer);holdTimer=null},{passive:true});
    tile.addEventListener('touchcancel',()=>{clearTimeout(holdTimer);holdTimer=null},{passive:true});
    tile.addEventListener('click',e=>{if(holdTriggered){e.stopImmediatePropagation();holdTriggered=false}},true);
    $('tiles').append(tile);
    if(thumbUrls.has(x.id))img.src=thumbUrls.get(x.id);
    if(gridCols===1){fullImageObserver.observe(img)}
    else if(!thumbUrls.has(x.id))thumbObserver.observe(img);
  }
  // Generate only thumbnails near the visible area to avoid large background decode queues.
  saveSession('results');
}

async function bulkChange(status){
  if(!selectedIds.size){toast('画像を選択してください');return}
  const ids=new Set(selectedIds);const items=images.filter(x=>ids.has(x.id));
  if(!items.length)return;
  const buttons=[...document.querySelectorAll('[data-bulk]')];buttons.forEach(b=>b.disabled=true);
  try{
    const bulkStamp=Date.now();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction('images','readwrite');const store=tx.objectStore('images');
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('保存失敗'));
      for(let i=0;i<items.length;i++){const x=items[i];store.put({...x,status:status||null,judgedAt:bulkStamp+i})}
    });
    for(let i=0;i<items.length;i++){items[i].status=status||null;items[i].judgedAt=bulkStamp+i}
    selectedIds.clear();bulkMode=false;results();toast(`${items.length}枚を変更しました`);
  }catch(e){alert('一括変更に失敗しました。'+e.message)}
  finally{buttons.forEach(b=>b.disabled=false)}
}

function crc32(data){let c=~0;for(let b of data){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (~c)>>>0}function le16(n){return [n&255,(n>>>8)&255]}function le32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
// ZIP with original image blobs, no recompression. Avoid retaining every image as a Uint8Array.
// Names are UTF-8 (general purpose flag bit 11), with a separate folder per category.
async function zip(items,onProgress=()=>{}){
  const chunks=[],central=[];let offset=0,count=0,countImages=0;
  const add=async(path,blob)=>{
    const name=enc.encode(path),size=blob.size;
    if(size>0xffffffff||offset+size>0xffffffff)throw new Error('ZIPが4GBの上限を超えます。画像を分けて保存してください');
    const data=size?new Uint8Array(await blob.arrayBuffer()):new Uint8Array();
    const crc=crc32(data),flags=0x0800;
    const local=new Uint8Array([80,75,3,4,...le16(20),...le16(flags),...le16(0),...le16(0),...le16(0),...le32(crc),...le32(size),...le32(size),...le16(name.length),...le16(0)]);
    chunks.push(local,name,blob);
    central.push(new Uint8Array([80,75,1,2,...le16(20),...le16(20),...le16(flags),...le16(0),...le16(0),...le16(0),...le32(crc),...le32(size),...le32(size),...le16(name.length),...le16(0),...le16(0),...le16(0),...le16(0),...le32(path.endsWith('/')?16:0),...le32(offset)]),name);
    offset+=local.length+name.length+size;count++;
  };
  const folders=[['good','GOOD'],['fix','要修正']];
  const bounds=sectionBounds();const sectionInfo=new Map();
  bounds.forEach((range,sectionIndex)=>{
    let localGood=0;
    for(let j=range.start;j<=range.end;j++){
      const x=images[j];if(x.status==='good')sectionInfo.set(x.id,{sectionIndex,local:++localGood});
    }
  });
  const exportTotal=items.filter(x=>x.status==='good'||x.status==='fix').length;
  for(const [status,folder] of folders){
    const subset=items.filter(x=>(x.status||'pending')===status);
    await add(folder+'/',new Blob());
    for(let i=0;i<subset.length;i++){
      const x=subset[i];
      if(!x.blob)throw new Error('元画像が見つかりません: '+x.name);
      const safe=x.name.replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').replace(/^\.+$/,'image');
      const filename=status==='good'
        ?`${String(i+1).padStart(3,'0')}_${sectionLetter(sectionInfo.get(x.id)?.sectionIndex??0)}${String(sectionInfo.get(x.id)?.local??i+1).padStart(2,'0')}${(x.name.match(/\.[^./\\]+$/)?.[0]||'.png')}`
        :`${String(i+1).padStart(4,'0')}_${safe}`;
      await add(`${folder}/${filename}`,x.blob);
      onProgress(++countImages,exportTotal);
    }
  }
  const csize=central.reduce((n,a)=>n+a.length,0);
  if(count>65535||csize>0xffffffff)throw new Error('ZIPのファイル数またはサイズが上限を超えました');
  const end=new Uint8Array([80,75,5,6,...le16(0),...le16(0),...le16(count),...le16(count),...le32(csize),...le32(offset),...le16(0)]);
  return new Blob([...chunks,...central,end],{type:'application/zip'});
}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
$('exportZip').onclick=async()=>{
  if(!images.length)return toast('画像がありません');
  if(!images.some(x=>x.status==='good'||x.status==='fix'))return toast('保存対象の画像がありません');
  const button=$('exportZip');button.disabled=true;
  try{
    const blob=await zip(images,(done,total)=>{button.textContent=`ZIP作成中 ${done}/${total}`});
    const safeName=(current.name||'写真集').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_');
    download(blob,`${safeName}_選定結果.zip`);
    toast('ZIPの保存を開始しました。保存先で中身を確認してください');
  }catch(e){alert('ZIP出力に失敗しました。'+e.message+'\n画像は削除されていません。')}
  finally{button.disabled=false;button.textContent='ZIP保存'}
};

// v1.6 static HUD preferences; no progress-bar animations.
const HUD_KEY='image-sorter-hud-v1';
const HUD_COLORS={blue:['#133f87','#3c97ff','#b9f4ff'],purple:['#4b238b','#ae68ff','#f0c4ff'],green:['#0c6154','#38e1b4','#b7fff1'],pink:['#83275b','#ff6ab7','#ffe1f2'],orange:['#7d3915','#ffad4c','#ffe1a5']};
const HUD_STYLES={simple:['シンプル','シャープな単色ゲージ'],neon:['ネオン','滑らかなグラデーション'],energy:['エナジー','分割された充填ゲージ']};
let hud={style:'neon',color:'blue'},settingsReturn='home';

function saveHud(){try{localStorage.setItem(HUD_KEY,JSON.stringify(hud))}catch{}}
function progressMarkup(pos,total){
 const [a,b,c]=HUD_COLORS[hud.color],percent=total?Math.min(100,Math.max(0,pos/total*100)):0;
 const electric='';
 return `<div class="progress-track style-${hud.style}" style="--g1:${a};--g2:${b};--spark:${c}" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${pos}" aria-label="現在位置"><div class="progress-fill" style="width:${percent}%">${electric}</div><span class="progress-label">${pos} / ${total}</span></div>`;
}
